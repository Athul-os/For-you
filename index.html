<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
    font-family: Arial, sans-serif;
  }

  .heart-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .heart {
    width: 100px;
    height: 90px;
    position: relative;
    animation: pulse 1.5s infinite;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    top: 0;
    width: 50px;
    height: 80px;
    border-radius: 50px 50px 0 0;
    background: #ff4757;
  }

  .heart::before {
    left: 50px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
  }

  .heart::after {
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .text {
    margin-top: 20px;
    font-size: 24px;
    color: #333;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="heart-container">
  <div class="heart"></div>
  <div class="text">ഐ ലവ് യു!</div>
</div>

</body
  >
</html>
